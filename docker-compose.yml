services:
  app:
    main:
    container_name: main-api
    restart: always
    image: node:20.10.0
    ports:
      - 4005:4006
    volumes:
      - uploads_data:/app/uploads

    networks:
      - monorepo-network
    
    #FOR PRODUCTION
    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod"
  
  wer2l:
    container_name: wer2l-api
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4005:4007
    volumes:
      - uploads_data:/app/uploads

    networks:
      - monorepo-network
    
    #FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
